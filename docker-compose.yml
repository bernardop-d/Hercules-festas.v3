services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-hercules}
      POSTGRES_USER:     ${POSTGRES_USER:-hercules}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hercules}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hercules}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hercules}:${POSTGRES_PASSWORD:-hercules}@db:5432/${POSTGRES_DB:-hercules}
      PORT: 5000
      HOST: 0.0.0.0
    ports:
      - "5000:5000"

volumes:
  postgres_data:
